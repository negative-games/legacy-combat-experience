plugins {
    id 'java'
    id "io.github.goooler.shadow" version "8.1.7"
    id "com.modrinth.minotaur" version "2.9.0"
}

def id = "LCE"
def group = 'games.negative.lce'
def version = '0.3.0'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }

    maven { url 'https://jitpack.io' }

    maven { url 'https://repo.moonrise.gg/repository/maven-snapshots/' }

    maven {
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }

    maven { url = uri("https://repo.codemc.io/repository/maven-releases/") }

    maven { url = uri("https://maven.enginehub.org/repo/") }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT")

    // alumina
    implementation("games.negative.alumina:alumina:3.2.1-SNAPSHOT")

    compileOnly("com.github.retrooper:packetevents-spigot:2.7.0")

    // ConfigLib
    compileOnly("de.exlll:configlib-yaml:4.5.0")

    // PlaceholderAPI
    compileOnly("me.clip:placeholderapi:2.11.6")

    // WorldGuard
    compileOnly("com.sk89q.worldguard:worldguard-bukkit:7.0.13")

    // Lombok
    compileOnly("org.projectlombok:lombok:1.18.32")
    annotationProcessor("org.projectlombok:lombok:1.18.32")

    testCompileOnly("io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT")
    testCompileOnly("com.github.retrooper:packetevents-spigot:2.7.0")
    testCompileOnly("de.exlll:configlib-yaml:4.5.0")
    testCompileOnly("org.projectlombok:lombok:1.18.32")
    testAnnotationProcessor("org.projectlombok:lombok:1.18.32")
    testImplementation("org.junit.jupiter:junit-jupiter:5.14.4")
    testRuntimeOnly("io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT")
    testRuntimeOnly("com.github.retrooper:packetevents-spigot:2.7.0")
    testRuntimeOnly("de.exlll:configlib-yaml:4.5.0")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.14.4")
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

tasks {
    build {
        dependsOn(shadowJar)
    }
}

shadowJar {
    archiveBaseName.set("${id}-${version}")
    archiveClassifier.set("")
    archiveVersion.set("")

    relocate "games.negative.alumina", "${group}.libs.alumina"
    //relocate "de.exlll.configlib", "${group}.libs.config"
}

def modrinthGameVersions = providers.environmentVariable("MODRINTH_GAME_VERSIONS")
        .map { versions -> versions.split(",").collect { it.trim() }.findAll { !it.isEmpty() } }
        .orElse(["1.21.4"])
def modrinthLoaders = providers.environmentVariable("MODRINTH_LOADERS")
        .map { loaders -> loaders.split(",").collect { it.trim() }.findAll { !it.isEmpty() } }
        .orElse(["paper"])

modrinth {
    token.set(providers.environmentVariable("MODRINTH_TOKEN"))
    projectId.set(providers.environmentVariable("MODRINTH_PROJECT_ID").orElse("legacy-combat-experience"))
    versionNumber.set(providers.environmentVariable("MODRINTH_VERSION_NUMBER").orElse(version))
    versionName.set(providers.environmentVariable("MODRINTH_VERSION_NAME").orElse("${id} ${version}"))
    versionType.set(providers.environmentVariable("MODRINTH_VERSION_TYPE").orElse("release"))
    uploadFile.set(tasks.shadowJar)
    gameVersions.addAll(modrinthGameVersions)
    loaders.addAll(modrinthLoaders)
    changelog.set(providers.environmentVariable("MODRINTH_CHANGELOG").orElse("Automated release."))
}

tasks.named("modrinth") {
    dependsOn(tasks.shadowJar)
}
